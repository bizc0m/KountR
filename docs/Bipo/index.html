<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Ouvre COUNTr avec la configuration Équilibre quotidien.">
  <title>COUNTr — Équilibre quotidien</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:#111318;color:#f2f4f7}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#111318}
    main{width:min(360px,100%);text-align:center}h1{font-size:18px;margin:0 0 8px}p{margin:0;color:#9ca3ad;font-size:14px;line-height:1.5}
    .loader{width:36px;height:36px;margin:0 auto 18px;border:3px solid #353a44;border-top-color:#7da0c4;border-radius:50%;animation:spin .7s linear infinite}
    a{display:none;margin-top:18px;color:#fff}body.error a{display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main>
    <div class="loader" aria-hidden="true"></div>
    <h1>Préparation d’Équilibre quotidien…</h1>
    <p id="status">Ouverture directe de COUNTr.</p>
    <a href="../app/">Ouvrir COUNTr</a>
  </main>
  <script>
  (()=>{
    const KEY='tallycounter_v2',ACTIVE='tallycounter_tab_v2',PRESET='bipolar-v1';
    const source=[
      ['sleep-hours','Sommeil (h)','😴','#7DA0C4',1,8,'night'],
      ['medication-morning','Traitement matin','💊','#76A98D',1,1,'morning'],
      ['medication-evening','Traitement soir','🌙','#6687A7',1,1,'evening'],
      ['meals','Repas','🍽️','#C9A45C',1,3,'none'],
      ['outside','Sortie dehors','☀️','#D0AE59',1,1,'afternoon'],
      ['activity','Activité (10 min)','🚶','#79A879',10,30,'none'],
      ['short-night','Nuit courte','⏱️','#D68155',1,null,'night'],
      ['agitation','Agitation','⚡','#D66A55',1,null,'none'],
      ['rapid-thoughts','Pensées rapides','💭','#C95E68',1,null,'none'],
      ['withdrawal','Repli','🏠','#756F9B',1,null,'none'],
      ['loss-interest','Perte d’intérêt','◼️','#686D88',1,null,'none'],
      ['fatigue','Fatigue forte','🔋','#65758A',1,null,'none']
    ];
    const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    try{
      let state;
      try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){state=null}
      if(!state||typeof state!=='object')state={tabs:[],tallies:[],logs:[],layouts:{},settings:{}};
      if(!Array.isArray(state.tabs))state.tabs=[];
      if(!Array.isArray(state.tallies))state.tallies=[];
      if(!Array.isArray(state.logs))state.logs=[];
      if(!state.layouts||typeof state.layouts!=='object')state.layouts={};
      let tab=state.tabs.find(t=>t.preset===PRESET)||state.tabs.find(t=>t.name==='Équilibre quotidien');
      if(!tab){
        tab={id:'bipo-'+uid(),name:'Équilibre quotidien',color:'#456A8A',preset:PRESET};
        state.tabs.push(tab);
        const ids=[];
        source.forEach(([seed,name,icon,color,step,goal,period])=>{
          const id=seed+'-'+uid();ids.push(id);
          state.tallies.push({id,tabId:tab.id,count:0,createdAt:new Date().toISOString(),name,icon,color,size:'third',step,goal,period,hours:1,parentId:null,countSize:38,iconSize:26,autoExport:true});
        });
        state.layouts[tab.id]=[...ids,null];
      }else if(!tab.preset){tab.preset=PRESET}
      localStorage.setItem(KEY,JSON.stringify(state));
      localStorage.setItem(ACTIVE,tab.id);
      location.replace('../app/');
    }catch(error){
      document.body.classList.add('error');
      document.getElementById('status').textContent='La configuration n’a pas pu être enregistrée dans ce navigateur.';
    }
  })();
  </script>
</body>
</html>
