border-color:#fff}.range input{width:100%}.actions{display:flex;gap:8px;margin-top:14px}.btn{min-height:40px;flex:1;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);cursor:pointer}.btn.primary{background:var(--accent);color:#101216;font-weight:700}.btn.danger{color:#ff8d96;border-color:#65363b;background:#2b1b1e}.check{display:flex;align-items:center;gap:9px;font-size:12px;margin:10px 0}.check input{width:18px;height:18px}.hint{font-size:10px;color:var(--muted);margin-top:5px}.historyItem{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.historyItem>div{flex:1}.deleteLog{border:0;background:#2a2e36;color:#aaa;border-radius:7px;width:34px;height:34px;font-size:18px}.undoBar{position:fixed;z-index:90;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:none;gap:12px;align-items:center;padding:8px 9px 8px 14px;border:1px solid var(--line);border-radius:22px;background:#292d35;font-size:12px}.undoBar.show{display:flex}.toast{position:fixed;z-index:100;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:none;padding:8px 13px;border-radius:18px;background:#292d35;font-size:12px}.toast.show{display:block}@media(max-width:420px){.brand i{display:none}.grid{grid-auto-rows:104px}.sheet{padding-left:14px;padding-right:14px}}
.dots{position:relative;width:17px;height:17px;padding:0;font-size:11px;transform:translateY(-5px)}.dots::after{content:"";position:absolute;inset:-9px}.logo{width:28px;height:28px;display:grid;place-items:center;border:1px solid #4a505b;border-radius:7px;background:#20242b;font:800 11px ui-monospace,monospace}.lock.on{color:#ff5964;border-color:#72343a;background:#2b1b1e}.tabWrap{display:flex;align-items:stretch}.tabWrap .tab{border-radius:7px 0 0 7px}.tabSettings{width:28px;border:1px solid transparent;border-left:1px solid #ffffff26;border-radius:0 7px 7px 0;background:inherit;color:inherit}.fav{width:28px;height:28px;border:0;background:transparent;color:inherit;font-size:18px;opacity:.65}.fav.on{opacity:1;color:#fff}.addTile.third{grid-column:span 4}.locked .dots,.locked .fav,.locked .addTile,.locked .tabSettings,.locked .tab.add{pointer-events:none;opacity:.2}.overlay.centered{align-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 12px calc(env(safe-area-inset-bottom,0px) + 16px)}.overlay.centered .sheet{border-radius:16px;max-height:88vh}.sheetHead{display:flex;align-items:center;gap:12px;margin-bottom:15px}.sheetHead h2{flex:1;margin:0}.saveTop{flex:0 0 auto;min-height:36px;padding:0 16px;border-color:#2d8150!important;background:#2f9e5b!important;color:#fff!important}.colorRow{display:grid;grid-template-columns:1fr 3fr;gap:10px;align-items:center}.colorRow input[type=color]{width:100%;height:42px;margin:0;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}.colorRow .swatches{align-content:center}.advanced{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.advanced summary{cursor:pointer;color:var(--text);font-size:13px;font-weight:700;padding:8px 0}.advanced[open] summary{margin-bottom:12px}@media(max-width:420px){.brand{display:none}.top{gap:6px}.tools{gap:4px}}
</style></head><body><noscript>JavaScript requis : téléchargez puis ouvrez ce fichier dans Safari ou Chrome.</noscript>
<header class="top"><div class="logo" aria-hidden="true">TC</div><div class="brand">TallyCounter <i>V2</i></div><div class="tools"><button class="tool" id="add" title="Ajouter">＋</button><button class="tool" id="undo" title="Annuler" disabled>↶</button><button class="tool lock" id="lock" title="Bloquer les réglages">🔓</button><button class="tool" id="prefs" title="Préférences">⚙</button><button class="tool" id="history" title="Historique">≡</button></div></header><nav class="tabs" id="tabs"></nav><main class="grid" id="grid"></main>
<div class="overlay centered" id="counterModal"><section class="sheet"><div class="sheetHead"><h2 id="counterTitle">Nouveau compteur</h2><button class="btn saveTop" id="saveCounter">Enregistrer</button></div><div class="field"><label>Nom</label><input class="input" id="name" maxlength="30"></div><div class="field"><label>Emoji — saisir ou rechercher</label><input class="input" id="emojiSearch" maxlength="30" placeholder="sport, santé, travail…"><div class="emojiGrid" id="emojiGrid"></div><div class="hint">Recherche locale fiable ; le catalogue complet en ligne sera chargé séparément sans bloquer l’application.</div></div><div class="field"><label>Couleur du compteur</label><div class="colorRow"><input type="color" id="customColor" value="#557fb8" aria-label="Couleur personnalisée"><div class="swatches" id="colors"></div></div></div><div class="field"><label>Largeur</label><div class="sizes" id="sizes"><button class="btn size" data-size="third">1/3</button><button class="btn size" data-size="half">1/2</button><button class="btn size" data-size="full">1</button></div></div><details class="advanced" id="counterAdvanced"><summary>Avancées</summary><div class="row"><div class="field"><label>Incrément</label><input class="input" type="number" id="step" min="1" value="1"></div><div class="field"><label>Objectif</label><input class="input" type="number" id="goal" min="0"></div></div><div class="row"><div class="field"><label>Période</label><select id="period"><option value="none">sans période</option><option value="hours">nombre d’heures</option><option value="morning">matin</option><option value="noon">midi</option><option value="afternoon">après-midi</option><option value="dinner">dîner</option><option value="evening">soirée</option><option value="night">nuit</option><option value="week">semaine</option><option value="month">mois</option><option value="year">année</option></select></div><div class="field" id="hoursField"><label>Durée en heures</label><input class="input" type="number" id="hours" min="1" value="1"></div></div><div class="field"><label>Objectif parent (imbriqué)</label><select id="parent"><option value="">aucun</option></select></div><div id="customSizing"><div class="row"><div class="range"><label>Taille chiffre <span id="countSizeVal"></span></label><input id="countSize" type="range" min="24" max="100"></div><div class="range"><label>Taille icône <span id="iconSizeVal"></span></label><input id="iconSize" type="range" min="14" max="70"></div></div></div></details><div class="actions" id="editActions"><button class="btn danger" id="deleteCounter">Supprimer compteur + historique</button><button class="btn" id="resetCounter">Remettre à zéro</button></div><div class="actions"><button class="btn" data-close="counterModal">Annuler</button></div></section></div>
<div class="overlay" id="prefsModal"><section class="sheet"><h2>Préférences</h2><div class="section">Affichage</div><label class="check"><input id="unified" type="checkbox">Tailles unifiées pour tous les compteurs</label><div class="row"><div class="range"><label>Chiffre <span id="globalCountVal"></span></label><input id="globalCount" type="range" min="24" max="100"></div><div class="range"><label>Icône <span id="globalIconVal"></span></label><input id="globalIcon" type="range" min="14" max="70"></div></div><div class="range"><label>Nom <span id="globalNameVal"></span></label><input id="globalName" type="range" min="9" max="22"></div><div class="section">Son</div><label class="check"><input id="sound" type="checkbox">Clic audio sur les compteurs</label><div class="range"><label>Volume <span id="volumeVal"></span></label><input id="volume" type="range" min="0" max="100"></div><div class="section">Données et partage</div><div class="actions"><button class="btn" id="importAll">Importer sauvegarde</button><button class="btn" id="exportAll">Sauvegarder / partager</button></div><div class="actions"><button class="btn" id="importSetup">Importer setup</button><button class="btn" id="exportSetup">Exporter setup</button></div><div class="actions"><button class="btn primary" data-close="prefsModal">Fermer</button></div></section></div>
<div class="overlay centered" id="tabModal"><section class="sheet"><div class="sheetHead"><h2 id="tabTitle">Nouvel onglet</h2><button class="btn saveTop" id="saveTab">Enregistrer</button></div><div class="field"><label>Nom</label><input class="input" id="tabName" maxlength="24"></div><div class="field"><label>Couleur</label><div class="colorRow"><input type="color" id="tabColor" value="#4d5562" aria-label="Couleur personnalisée de l’onglet"><div class="swatches" id="tabColors"></div></div></div><div class="actions"><button class="btn danger" id="deleteTab">Supprimer l’onglet</button><button class="btn" data-close="tabModal">Annuler</button></div></section></div>
<div class="overlay" id="historyModal"><section class="sheet"><h2>Historique</h2><div class="row"><select id="historyFilter"><option value="all">Tous</option></select><select id="historySort"><option value="new">Plus récent</option><option value="old">Plus ancien</option><option value="name">Par compteur</option></select></div><div id="historyList"></div><div class="actions"><button class="btn" id="mailHistory">Envoyer par mail</button><button class="btn primary" data-close="historyModal">Fermer</button></div></section></div>
<div class="overlay" id="confirmModal"><section class="sheet"><h2 id="confirmText">Confirmer</h2><div class="actions"><button class="btn" id="confirmNo">Annuler</button><button class="btn danger" id="confirmYes">Confirmer</button></div></section></div><input type="file" id="file" accept="application/json" hidden><div class="undoBar" id="undoBar"><span id="undoText"></span><button class="btn" id="undoDeleted">Annuler</button></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),KEY='tallycounter_v2',ACTIVE='tallycounter_tab_v2',clone=o=>JSON.parse(JSON.stringify(o));
const COLORS=['#d85c66','#c87b4b','#c3a84b','#5fa675','#4a9fa8','#557fb8','#7a67b0','#ad638f','#8a9099'];
const EMOJIS=[['✅','fait validation tâche'],['⭐','favori étoile'],['🔥','motivation feu'],['💧','eau hydratation'],['💪','sport force'],['🏃','course sport'],['🚶','marche pas'],['🚴','vélo sport'],['🧠','cerveau étude'],['📚','livre lecture'],['✍️','écrire'],['💻','travail ordinateur'],['❤️','coeur santé'],['💊','médicament'],['😴','sommeil nuit'],['🍎','repas nourriture'],['💰','argent finance'],['📞','appel téléphone'],['📧','mail courrier'],['📦','colis livraison'],['☕','café'],['🚭','tabac arrêt'],['🧹','ménage'],['🌱','plante'],['🎯','objectif'],['⏱️','temps'],['📅','calendrier'],['🔁','récurrence'],['#','nombre'],['+','plus'],['%','pourcentage'],['@','contact']];
const defaults={tabs:[{id:'general',name:'Général',color:'#4d5562'}],tallies:[],logs:[],settings:{unified:true,countSize:44,iconSize:27,nameSize:11,sound:false,volume:30,locked:false}};
let memory={},storageOK=true;function get(k){try{return localStorage.getItem(k)}catch(e){storageOK=false;return memory[k]||null}}function set(k,v){try{localStorage.setItem(k,v)}catch(e){storageOK=false;memory[k]=v}}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function iso(){return new Date().toISOString()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function contrast(hex){const v=(hex||'#555555').replace('#',''),n=[0,2,4].map(i=>parseInt(v.slice(i,i+2),16)||0);return(.299*n[0]+.587*n[1]+.114*n[2])/255>.62?'#111318':'#f7f8fa'}
function load(){try{const x=JSON.parse(get(KEY));if(x&&typeof x==='object')return x}catch(e){}return clone(defaults)}let S=load();S.tabs=Array.isArray(S.tabs)&&S.tabs.length?S.tabs:clone(defaults.tabs);S.tallies=Array.isArray(S.tallies)?S.tallies:[];S.logs=Array.isArray(S.logs)?S.logs:[];S.settings={...defaults.settings,...(S.settings||{})};S.tabs.forEach(t=>t.color=t.color||'#4d5562');S.tallies.forEach(t=>{t.tabId=t.tabId||S.tabs[0].id;t.step=Math.max(1,+t.step||1);t.count=+t.count||0;if(!['third','half','full'].includes(t.size))t.size=t.size==='twothirds'?'half':'third'});let active=get(ACTIVE)||S.tabs[0].id;if(!S.tabs.some(t=>t.id===active))active=S.tabs[0].id;function save(){set(KEY,JSON.stringify(S))}
let editing=null,editingTab=null,pickedColor=COLORS[5],pickedSize='third',pickedEmoji='#',lastAction=null,deleted=[],deleteTimer=null,fileMode='all',confirmFn=null,audioCtx=null;
function show(id){$(id).classList.add('show')}function hide(id){$(id).classList.remove('show')}function note(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(note.t);note.t=setTimeout(()=>$('toast').classList.remove('show'),1600)}function ask(text,fn){$('confirmText').textContent=text;confirmFn=fn;show('confirmModal')}
async function play(){if(!S.settings.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;audioCtx=audioCtx||new C();if(audioCtx.state==='suspended')await audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=620;g.gain.setValueAtTime(Math.max(.001,(S.settings.volume/100)*.09),audioCtx.currentTime);o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.07);o.stop(audioCtx.currentTime+.075)}catch(e){note('Son indisponible sur ce navigateur')}}
function periodLabel(t){const m={none:'',hours:`/${t.hours||1}h`,morning:'/matin',noon:'/midi',afternoon:'/après-midi',dinner:'/dîner',evening:'/soirée',night:'/nuit',week:'/semaine',month:'/mois',year:'/année'};return m[t.period||'none']||''}
function render(){document.body.classList.toggle('locked',S.settings.locked);$('lock').textContent=S.settings.locked?'🔒':'🔓';$('lock').classList.toggle('on',S.settings.locked);$('lock').title=S.settings.locked?'Débloquer les réglages':'Bloquer les réglages';$('add').disabled=$('prefs').disabled=S.settings.locked;renderTabs();const grid=$('grid');grid.innerHTML='';S.tallies.filter(t=>t.tabId===active).forEach(t=>{const el=document.createElement('article');el.className='tile '+(t.size||'third');el.style.background=t.color;el.style.color=contrast(t.color);el.style.setProperty('--count-size',(S.settings.unified?S.settings.countSize:(t.countSize||S.settings.countSize))+'px');el.style.setProperty('--icon-size',(S.settings.unified?S.settings.iconSize:(t.iconSize||S.settings.iconSize))+'px');el.innerHTML=`<div class="tileTop"><button class="dots" aria-label="Régler ${esc(t.name)}">⋮</button><div class="count">${t.count}</div><div class="emoji">${esc(t.icon)}</div></div><div class="tileBottom"><span style="font-size:${S.settings.nameSize}px">${esc(t.name)}</span><span class="goal">${t.goal?`${t.count}/${t.goal}${periodLabel(t)}`:''}</span></div>`;el.addEventListener('click',e=>{if(e.target.closest('button'))return;const d=t.step||1;t.count+=d;const l={id:id(),tallyId:t.id,name:t.name,delta:d,total:t.count,ts:iso()};S.logs.push(l);lastAction=l;$('undo').disabled=false;play();save();render()});el.querySelector('.dots').addEventListener('click',()=>{if(!S.settings.locked)openCounter(t)});grid.appendChild(el)});for(let i=0;i<3;i++){const a=document.createElement('button');a.className='addTile third';a.textContent='+';a.title='Ajouter un compteur 1/3';a.addEventListener('click',()=>{if(!S.settings.locked)openCounter(null,'third')});grid.appendChild(a)}}
function renderTabs(){const nav=$('tabs');nav.innerHTML='';S.tabs.forEach(t=>{const w=document.createElement('div');w.className='tabWrap';w.style.background=t.color;w.style.color=contrast(t.color);const b=document.createElement('button');b.className='tab'+(t.id===active?' active':'');b.textContent=t.name;b.style.background='inherit';b.style.color='inherit';b.addEventListener('click',()=>{active=t.id;set(ACTIVE,active);render()});const s=document.createElement('button');s.className='tabSettings';s.textContent='⋮';s.title='Réglages de l’onglet';s.addEventListener('click',()=>{if(!S.settings.locked)openTab(t)});w.append(b,s);nav.appendChild(w)});const a=document.createElement('button');a.className='tab add';a.textContent='+';a.addEventListener('click',()=>{if(!S.settings.locked)openTab()});nav.appendChild(a)}
function buildEmoji(){const q=$('emojiSearch').value.trim().toLowerCase(),box=$('emojiGrid');box.innerHTML='';EMOJIS.filter(([e,w])=>!q||e===q||w.includes(q)).forEach(([e,w])=>{const b=document.createElement('button');b.textContent=e;b.title=w;b.className=e===pickedEmoji?'sel':'';b.addEventListener('click',()=>{pickedEmoji=e;$('emojiSearch').value=e;buildEmoji()});box.appendChild(b)})}
function buildColors(){const box=$('colors');box.innerHTML='';COLORS.forEach(c=>{const b=document.createElement('button');b.className='swatch'+(c===pickedColor?' sel':'');b.style.background=c;b.addEventListener('click',()=>{pickedColor=c;$('customColor').value=c;buildColors()});box.appendChild(b)})}
function buildTabColors(){const box=$('tabColors'),current=$('tabColor').value.toLowerCase();box.innerHTML='';COLORS.forEach(c=>{const b=document.createElement('button');b.className='swatch'+(c===current?' sel':'');b.style.background=c;b.addEventListener('click',()=>{$('tabColor').value=c;buildTabColors()});box.appendChild(b)})}
function openCounter(t,size){editing=t?.id||null;pickedColor=t?.color||COLORS[5];pickedSize=t?.size||size||'third';pickedEmoji=t?.icon||'#';$('counterAdvanced').open=false;$('counterTitle').textContent=t?'Modifier le compteur':'Nouveau compteur';$('name').value=t?.name||'';$('emojiSearch').value=pickedEmoji;$('customColor').value=pickedColor;$('step').value=t?.step||1;$('goal').value=t?.goal||'';$('period').value=t?.period||'none';$('hoursField').style.display=$('period').value==='hours'?'block':'none';$('hours').value=t?.hours||1;$('countSize').value=t?.countSize||S.settings.countSize;$('iconSize').value=t?.iconSize||S.settings.iconSize;$('countSizeVal').textContent=$('countSize').value+'px';$('iconSizeVal').textContent=$('iconSize').value+'px';$('customSizing').style.opacity=S.settings.unified?'.35':'1';$('countSize').disabled=$('iconSize').disabled=S.settings.unified;$('editActions').style.display=t?'flex':'none';$('parent').innerHTML='<option value="">aucun</option>'+S.tallies.filter(x=>x.id!==editing).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('parent').value=t?.parentId||'';buildEmoji();buildColors();[...$('sizes').children].forEach(b=>b.classList.toggle('primary',b.dataset.size===pickedSize));show('counterModal')}
function saveCounter(){const name=$('name').value.trim()||'Sans nom',typed=$('emojiSearch').value.trim(),icon=EMOJIS.some(x=>x[0]===typed)?typed:pickedEmoji;const data={name,icon,color:pickedColor,size:pickedSize,step:Math.max(1,+$('step').value||1),goal:+$('goal').value||null,period:$('period').value,hours:Math.max(1,+$('hours').value||1),parentId:$('parent').value||null,countSize:+$('countSize').value,iconSize:+$('iconSize').value};if(editing)Object.assign(S.tallies.find(t=>t.id===editing),data);else S.tallies.push({id:id(),tabId:active,count:0,createdAt:iso(),...data});save();hide('counterModal');render();note('Enregistré')}
function openTab(t){editingTab=t?.id||null;$('tabTitle').textContent=t?'Modifier l’onglet':'Nouvel onglet';$('tabName').value=t?.name||'';$('tabColor').value=t?.color||'#4d5562';buildTabColors();$('deleteTab').style.display=t&&S.tabs.length>1?'block':'none';show('tabModal')}
function saveTab(){const name=$('tabName').value.trim();if(!name)return;const color=$('tabColor').value;if(editingTab)Object.assign(S.tabs.find(t=>t.id===editingTab),{name,color});else{const t={id:id(),name,color};S.tabs.push(t);active=t.id;set(ACTIVE,active)}save();hide('tabModal');render()}
function syncPrefs(){for(const [id,k]of[['unified','unified'],['sound','sound']])$(id).checked=!!S.settings[k];for(const [id,k]of[['globalCount','countSize'],['globalIcon','iconSize'],['globalName','nameSize'],['volume','volume']]){$(id).value=S.settings[k];$(id+'Val').textContent=S.settings[k]+(id==='volume'?'%':'px')}}
function visibleLogs(){let a=S.logs.filter(l=>$('historyFilter').value==='all'||l.tallyId===$('historyFilter').value);const mode=$('historySort').value;return [...a].sort((x,y)=>mode==='old'?new Date(x.ts)-new Date(y.ts):mode==='name'?x.name.localeCompare(y.name):new Date(y.ts)-new Date(x.ts))}
function renderHistory(){const f=$('historyFilter'),keep=f.value;f.innerHTML='<option value="all">Tous</option>'+S.tallies.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');f.value=[...f.options].some(o=>o.value===keep)?keep:'all';$('historyList').innerHTML=visibleLogs().slice(0,300).map(l=>`<div class="historyItem"><div><b>${esc(l.name)}</b> ${l.delta>0?'+':''}${l.delta} · ${l.total}<div class="hint">${new Date(l.ts).toLocaleString('fr-FR')}</div></div><button class="deleteLog" data-id="${l.id}">×</button></div>`).join('')||'<p class="hint">Aucune entrée.</p>';document.querySelectorAll('.deleteLog').forEach(b=>b.onclick=()=>deleteLog(b.dataset.id))}
function deleteLog(logId){const l=S.logs.find(x=>x.id===logId);if(!l)return;deleted.push(l);S.logs=S.logs.filter(x=>x.id!==logId);recompute(l.tallyId);save();render();renderHistory();clearTimeout(deleteTimer);$('undoText').textContent=deleted.length+' entrée'+(deleted.length>1?'s':'')+' supprimée'+(deleted.length>1?'s':'');$('undoBar').classList.add('show');deleteTimer=setTimeout(()=>{deleted=[];$('undoBar').classList.remove('show')},5000)}function recompute(tid){let n=0;S.logs.filter(l=>l.tallyId===tid).sort((a,b)=>new Date(a.ts)-new Date(b.ts)).forEach(l=>{n+=l.delta;l.total=n});const t=S.tallies.find(x=>x.id===tid);if(t)t.count=n}
function csv(logs){return'compteur,date_iso,variation,total\n'+logs.map(l=>`"${String(l.name).replaceAll('"','""')}","${l.ts}",${l.delta},${l.total}`).join('\n')}function download(content,name,type='application/json'){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),100)}function backup(setupOnly=false){const tab=S.tabs.find(t=>t.id===active),ts=S.tallies.filter(t=>!setupOnly||t.tabId===active),ids=new Set(ts.map(t=>t.id)),data=setupOnly?{app:'TallyCounter',version:2,tabs:[tab],tallies:ts,logs:S.logs.filter(l=>ids.has(l.tallyId)),settings:S.settings}:{app:'TallyCounter',version:2,...S};download(JSON.stringify(data,null,2),setupOnly?'tallycounter-setup.json':'tallycounter-backup.json')}
function importData(data,setupOnly){if(!data||!Array.isArray(data.tallies))throw Error('Format invalide');if(setupOnly){const nt={...(data.tabs?.[0]||{name:'Setup importé',color:'#4d5562'}),id:id()},map={};S.tabs.push(nt);data.tallies.forEach(t=>{const old=t.id,n={...t,id:id(),tabId:nt.id};map[old]=n.id;S.tallies.push(n)});(data.logs||[]).forEach(l=>map[l.tallyId]&&S.logs.push({...l,id:id(),tallyId:map[l.tallyId]}));active=nt.id}else{S={tabs:data.tabs||defaults.tabs,tallies:data.tallies,logs:data.logs||[],settings:{...defaults.settings,...(data.settings||{})}};active=S.tabs[0].id}save();set(ACTIVE,active);render();note('Import réussi')}
document.addEventListener('click',e=>{const c=e.target.dataset.close;if(c)hide(c)});$('add').onclick=()=>openCounter();$('lock').onclick=()=>{S.settings.locked=!S.settings.locked;save();render();note(S.settings.locked?'Réglages bloqués':'Réglages débloqués')};$('prefs').onclick=()=>{syncPrefs();show('prefsModal')};$('history').onclick=()=>{renderHistory();show('historyModal')};$('saveCounter').onclick=saveCounter;$('saveTab').onclick=saveTab;$('emojiSearch').oninput=buildEmoji;$('customColor').oninput=e=>{pickedColor=e.target.value;buildColors()};$('tabColor').oninput=buildTabColors;$('sizes').onclick=e=>{const s=e.target.dataset.size;if(s){pickedSize=s;[...$('sizes').children].forEach(b=>b.classList.toggle('primary',b.dataset.size===s))}};$('countSize').oninput=e=>$('countSizeVal').textContent=e.target.value+'px';$('iconSize').oninput=e=>$('iconSizeVal').textContent=e.target.value+'px';$('period').onchange=e=>$('hoursField').style.display=e.target.value==='hours'?'block':'none';
$('undo').onclick=()=>{if(!lastAction)return;S.logs=S.logs.filter(l=>l.id!==lastAction.id);recompute(lastAction.tallyId);lastAction=null;$('undo').disabled=true;save();render()};$('resetCounter').onclick=()=>ask('Remettre ce compteur à zéro ?',()=>{const t=S.tallies.find(x=>x.id===editing),d=-t.count;t.count=0;S.logs.push({id:id(),tallyId:t.id,name:t.name,delta:d,total:0,ts:iso()});save();hide('counterModal');render()});$('deleteCounter').onclick=()=>ask('Supprimer ce compteur ET tout son historique ?',()=>{S.tallies=S.tallies.filter(t=>t.id!==editing);S.logs=S.logs.filter(l=>l.tallyId!==editing);save();hide('counterModal');render()});$('deleteTab').onclick=()=>ask('Supprimer cet onglet ET tous ses compteurs ?',()=>{const ids=new Set(S.tallies.filter(t=>t.tabId===editingTab).map(t=>t.id));S.tabs=S.tabs.filter(t=>t.id!==editingTab);S.tallies=S.tallies.filter(t=>t.tabId!==editingTab);S.logs=S.logs.filter(l=>!ids.has(l.tallyId));active=S.tabs[0].id;save();hide('tabModal');render()});$('confirmNo').onclick=()=>hide('confirmModal');$('confirmYes').onclick=()=>{hide('confirmModal');const f=confirmFn;confirmFn=null;f?.()};
for(const [id,k]of[['unified','unified'],['sound','sound']])$(id).onchange=e=>{S.settings[k]=e.target.checked;save();render()};for(const [id,k]of[['globalCount','countSize'],['globalIcon','iconSize'],['globalName','nameSize'],['volume','volume']])$(id).oninput=e=>{S.settings[k]=+e.target.value;$(id+'Val').textContent=e.target.value+(id==='volume'?'%':'px');save();render()};$('exportAll').onclick=()=>backup(false);$('exportSetup').onclick=()=>backup(true);$('importAll').onclick=()=>{fileMode='all';$('file').click()};$('importSetup').onclick=()=>{fileMode='setup';$('file').click()};$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{importData(JSON.parse(r.result),fileMode==='setup')}catch(x){note('Fichier invalide')}};r.readAsText(f);e.target.value=''};$('historyFilter').onchange=renderHistory;$('historySort').onchange=renderHistory;$('undoDeleted').onclick=()=>{S.logs.push(...deleted);[...new Set(deleted.map(l=>l.tallyId))].forEach(recompute);deleted=[];clearTimeout(deleteTimer);$('undoBar').classList.remove('show');save();render();renderHistory()};$('mailHistory').onclick=()=>location.href='mailto:?subject='+encodeURIComponent('Historique TallyCounter')+'&body='+encodeURIComponent(csv(visibleLogs()));
save();render();if(!storageOK)note('Stockage privé : exportez vos données');
})();
